[package]
name = "pdfcraft-create"
description = "Create PDFs: blank documents, from images (PNG, JPEG), plain text and Word (.docx)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
pdfcraft-model = { workspace = true }
pdfcraft-fonts = { workspace = true }
flate2.workspace = true
png = "0.18"
quick-xml = { version = "0.41", default-features = false }
tiff = "0.11"
image = { version = "0.25", default-features = false, features = ["bmp", "gif"] }
thiserror = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif"] }
hayro-syntax = { workspace = true }
